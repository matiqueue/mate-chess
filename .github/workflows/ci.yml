name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typy, lint, testy i build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check-types

      - name: Lint
        run: pnpm lint

      - name: Test (chess engine)
        run: pnpm test

      # Aplikację web buduje i wdraża Vercel (podgląd dla każdego PR), tutaj budujemy pozostałe aplikacje
      - name: Build landing, admin, server and errors
        run: pnpm turbo build --filter=landing --filter=admin --filter=server --filter=errors
