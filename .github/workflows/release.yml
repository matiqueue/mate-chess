name: Build Tauri + Next.js Desktop App

on:
  push:
    branches:
      - main

# Workflow tylko buduje aplikację i wrzuca artefakty – wystarczy odczyt repozytorium
permissions:
  contents: read

# Sekrety ustaw w: Settings → Secrets and variables → Actions
env:
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
  CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  NEXT_PUBLIC_ADMIN_USERNAME: ${{ secrets.NEXT_PUBLIC_ADMIN_USERNAME }}
  NEXT_PUBLIC_ADMIN_PASSWORD: ${{ secrets.NEXT_PUBLIC_ADMIN_PASSWORD }}

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Tauri 2)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Add environment variables
        run: pnpm env:setup

      - name: Build application
        run: pnpm build

      - name: Archive Linux build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mate-chess-linux
          path: apps/desktop/src-tauri/target/release/bundle/

  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Add environment variables
        run: pnpm env:setup

      - name: Build application
        run: pnpm build

      - name: Archive Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mate-chess-windows
          path: apps/desktop/src-tauri/target/release/bundle/

  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Add environment variables
        run: pnpm env:setup

      - name: Build application
        run: pnpm build

      - name: Archive macOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mate-chess-macos
          path: apps/desktop/src-tauri/target/release/bundle/
