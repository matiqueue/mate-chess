<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="mc-bg" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#232328"/>
      <stop offset="55%" stop-color="#121216"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <radialGradient id="mc-spot" cx="48%" cy="34%" r="58%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mc-light" x1="150" y1="90" x2="340" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e4e4e7"/>
    </linearGradient>
    <linearGradient id="mc-mid" x1="250" y1="100" x2="370" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d4d4d8"/>
      <stop offset="100%" stop-color="#71717a"/>
    </linearGradient>
    <clipPath id="mc-clip">
      <rect width="512" height="512" rx="116"/>
    </clipPath>
  </defs>

  <g clip-path="url(#mc-clip)">
    <!-- Matte monochrome squircle -->
    <rect width="512" height="512" rx="116" fill="url(#mc-bg)"/>

    <!-- Subtle 2x2 architectural chessboard split -->
    <rect x="0" y="0" width="256" height="256" fill="#ffffff" fill-opacity="0.035"/>
    <rect x="256" y="256" width="256" height="256" fill="#ffffff" fill-opacity="0.035"/>

    <!-- Soft top spotlight -->
    <circle cx="256" cy="180" r="230" fill="url(#mc-spot)"/>

    <!-- Pure architectural geometric Knight silhouette (zero cartoonish eye) -->
    <path
      d="M170 356 L190 282 L248 244 L176 244 L142 214 L158 178 L224 132 L244 94 L276 126 C332 144 366 202 360 286 L344 356 Z"
      fill="url(#mc-light)"
    />
    <!-- Sculpted metallic right facet (mane ridge) -->
    <path
      d="M276 126 C332 144 366 202 360 286 L344 356 H274 L290 252 C294 206 276 162 248 138 L244 94 Z"
      fill="url(#mc-mid)"
    />
    <!-- Subtle diagonal architectural slash accent across upper neck -->
    <path
      d="M190 282 L292 212"
      stroke="#0e0e11"
      stroke-opacity="0.22"
      stroke-width="6"
      stroke-linecap="round"
    />

    <!-- Two-tier minimalist base -->
    <rect x="160" y="370" width="192" height="16" rx="8" fill="#d4d4d8"/>
    <rect x="138" y="396" width="236" height="26" rx="13" fill="url(#mc-light)"/>
  </g>

  <rect x="2" y="2" width="508" height="508" rx="114" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4"/>
</svg>
